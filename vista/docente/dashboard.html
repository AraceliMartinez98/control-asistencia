<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel del docente - Asistencia PP3</title>
    <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>

    <h1>Panel del docente</h1>
    <p>
        Hola, <span id="nombreUsuario"></span> —
        <a href="#" id="linkLogout">Cerrar sesion</a>
    </p>

    <p>Aca van a ir las comisiones a cargo del docente (proximo paso).</p>

    <script type="module">
        import { protegerPagina } from "../../controlador/authGuard.js";
        import { handleLogout } from "../../controlador/authController.js";

        const usuario = protegerPagina("docente");
        if (usuario) {
            document.getElementById("nombreUsuario").textContent = usuario.nombre;
        }
        document.getElementById("linkLogout").addEventListener("click", handleLogout);
    </script>

</body>
</html>
